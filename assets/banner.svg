<svg fill="none" viewBox="0 0 1200 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .badge-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .stat-val {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 16px;
        fill: #f8fafc;
      }
      .stat-lbl {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 12px;
        fill: #64748b;
      }
      /* Subtle pulse & stream animations */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-12px) translateX(6px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      .pulse-bg {
        transform-origin: 950px 180px;
        animation: pulseGlow 7s ease-in-out infinite;
      }
      .pulse-bg2 {
        transform-origin: 200px 80px;
        animation: pulseGlow 9s ease-in-out infinite reverse;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: flowDash 3s linear infinite;
      }
      .p1 { animation: floatParticle 4s ease-in-out infinite; }
      .p2 { animation: floatParticle 6s ease-in-out infinite 1s; }
      .p3 { animation: floatParticle 5s ease-in-out infinite 2s; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="980" cy="180" r="140" fill="#3b82f6" fill-opacity="0.25" filter="url(#glow)" class="pulse-bg"/>
  <circle cx="1060" cy="120" r="100" fill="#8b5cf6" fill-opacity="0.2" filter="url(#glow)" class="pulse-bg"/>
  <circle cx="180" cy="90" r="120" fill="#06b6d4" fill-opacity="0.15" filter="url(#glow)" class="pulse-bg2"/>

  <!-- Subtle Network Graph Lines in Background (Tech Aesthetic) -->
  <g stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" fill="none">
    <path d="M 750,90 Q 860,50 960,110 T 1120,90" class="flow-line" />
    <path d="M 780,270 Q 900,310 1020,240 T 1140,260" class="flow-line" />
    <path d="M 880,180 L 1050,180" stroke-dasharray="4 4" opacity="0.4" />
    <path d="M 960,110 L 1050,180 L 1020,240" stroke-dasharray="4 4" opacity="0.4" />
  </g>

  <!-- Interactive/Floating Metric Nodes (Right Side Background) -->
  <g class="p1">
    <circle cx="960" cy="110" r="7" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="960" cy="110" r="3" fill="#ffffff"/>
  </g>
  <g class="p2">
    <circle cx="1050" cy="180" r="9" fill="#3b82f6" filter="url(#glow)"/>
    <circle cx="1050" cy="180" r="4" fill="#ffffff"/>
  </g>
  <g class="p3">
    <circle cx="1020" cy="240" r="7" fill="#a855f7" filter="url(#glow)"/>
    <circle cx="1020" cy="240" r="3" fill="#ffffff"/>
  </g>

  <!-- Foreground Glass Cards for Architecture Highlights -->
  <g transform="translate(840, 60)">
    <rect width="280" height="70" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
    <circle cx="35" cy="35" r="16" fill="#0284c7" fill-opacity="0.3"/>
    <text x="35" y="41" text-anchor="middle" font-size="16">⚡</text>
    <text x="68" y="31" class="stat-val">&lt; 1 ms Latency</text>
    <text x="68" y="50" class="stat-lbl">Sub-millisecond data access</text>
  </g>

  <g transform="translate(840, 145)">
    <rect width="280" height="70" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
    <circle cx="35" cy="35" r="16" fill="#7c3aed" fill-opacity="0.3"/>
    <text x="35" y="41" text-anchor="middle" font-size="16">🔄</text>
    <text x="68" y="31" class="stat-val">Redis &amp; Valkey API</text>
    <text x="68" y="50" class="stat-lbl">100% protocol compatibility</text>
  </g>

  <g transform="translate(840, 230)">
    <rect width="280" height="70" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
    <circle cx="35" cy="35" r="16" fill="#059669" fill-opacity="0.3"/>
    <text x="35" y="41" text-anchor="middle" font-size="16">☁️</text>
    <text x="68" y="31" class="stat-val">Managed &amp; Multi-AZ</text>
    <text x="68" y="50" class="stat-lbl">Auto-failover &amp; clustering</text>
  </g>

  <!-- Foreground Content: Header, Badges & Titles -->
  <!-- Pill Tag -->
  <g transform="translate(70, 52)">
    <rect width="240" height="30" rx="15" fill="#0369a1" fill-opacity="0.25" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="16" cy="15" r="4" fill="#38bdf8"/>
    <text x="30" y="20" class="badge-label">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Main Titles (Crisp, High Contrast Foreground) -->
  <g transform="translate(70, 130)">
    <text x="0" y="0" class="title-text">Awesome Managed Cloud</text>
    <text x="0" y="46" class="title-text" fill="url(#accent-cyan)">In-Memory Cache</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(70, 215)">
    <text x="0" y="0" class="subtitle-text">The definitive guide to fully managed in-memory caching solutions,</text>
    <text x="0" y="26" class="subtitle-text">distributed data grids, and open-source Redis/Valkey cache engines.</text>
  </g>

  <!-- Micro Feature Chips -->
  <g transform="translate(70, 280)">
    <rect width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="65" y="18" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">🚀 High Throughput</text>

    <rect x="142" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="207" y="18" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">🛡️ Zero Downtime</text>

    <rect x="284" width="140" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="354" y="18" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">🌐 Multi-Cloud &amp; Edge</text>
  </g>
</svg>
